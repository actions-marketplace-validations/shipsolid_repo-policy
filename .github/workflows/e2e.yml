name: E2E (live fixture repo)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -m e2e -v
        env:
          REPO_POLICY_E2E_TOKEN: ${{ secrets.REPO_POLICY_E2E_TOKEN }}
