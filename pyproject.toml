[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-policy"
version = "0.3.0"
description = "Lightweight, declarative repository governance for GitHub."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Amit Singh" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "click>=8.1,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
repo-policy = "repo_policy.cli:main"

[project.urls]
Homepage = "https://github.com/shipsolid/repo-policy"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_policy"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/repo_policy/__init__.py:__version__"]
branch = "main"
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
